buildscript {
  ext.ApphudSdk = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    buildToolsVersion: "36.0.0"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ApphudSdk[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Runs Codegen for the specs declared in `codegenConfig` (package.json) and
// puts the generated TurboModule / Fabric interfaces on the compile classpath.
apply plugin: "com.facebook.react"

def apphudPackageJson = new groovy.json.JsonSlurper().parse(file("../package.json"))
def reactNativeApphudSdkVersion = apphudPackageJson.version

android {
  namespace "com.reactnativeapphudsdk"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  buildToolsVersion getExtOrDefault("buildToolsVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    buildConfigField "String", "REACT_NATIVE_APPHUD_SDK_VERSION", "\"${reactNativeApphudSdkVersion}\""
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Exposed as `api` so host apps can call Apphud.handleIntent / handleUri
  // directly from their Activity when they prefer native deep link forwarding.
  api "com.apphud:ApphudSDK-Android:3.4.2"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  implementation "com.android.billingclient:billing:8.3.0"
}
